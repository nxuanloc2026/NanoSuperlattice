[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosuperlattice"
dynamic = ["version"]
description = "Oriented nanocrystal superlattices: interactive 3D viewer, kinematic SAXS/WAXS and bridges to external scattering codes."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Loc Ngo" }]
# TODO before publishing to the real PyPI: choose a license, add a LICENSE
# file, and declare it here (e.g. license = { text = "MIT" }).
dependencies = ["numpy>=1.23"]
keywords = ["nanocrystal", "superlattice", "SAXS", "WAXS", "GISAXS", "X-ray scattering", "crystallography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
bornagain = ["bornagain>=25"]
dans = ["Dans_Diffraction>=3.4"]
all = ["bornagain>=25", "Dans_Diffraction>=3.4"]

[project.urls]
Homepage = "https://github.com/nxuanloc2026/NanoSuperlattice"
Documentation = "https://github.com/nxuanloc2026/NanoSuperlattice/blob/main/INTEGRATIONS.md"

[project.scripts]
nanosuperlattice = "nanosuperlattice.visualize_superlattice:main"
nanosuperlattice-integrations = "nanosuperlattice.integrations:main"

[tool.setuptools]
packages = ["nanosuperlattice"]

[tool.setuptools.dynamic]
version = { attr = "nanosuperlattice.__version__" }

[tool.setuptools.package-data]
nanosuperlattice = ["f0_WaasKirf.dat", "nanocrystal_viewer.html"]
