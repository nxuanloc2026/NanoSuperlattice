# Build the sdist and wheel, test the wheel, and upload both to TestPyPI.
# Runs only when started by hand: Actions tab -> "Publish to TestPyPI" -> Run workflow.
#
# One-time setup (trusted publishing, no API token stored in GitHub):
#   1. On https://test.pypi.org -> Your account -> Publishing -> "Add a new pending publisher":
#        PyPI project name: nanosuperlattice
#        Owner: nxuanloc2026      Repository: NanoSuperlattice
#        Workflow name: publish-testpypi.yml      Environment name: testpypi
#   2. In this GitHub repository: Settings -> Environments -> New environment "testpypi".
#
# TestPyPI never accepts the same version twice: bump __version__ in
# nanosuperlattice/__init__.py before each new upload.
name: Publish to TestPyPI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          cd tests && python -m unittest discover -v .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
